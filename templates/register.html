{% extends "base.html" %} {% block title %}Register - CipherForge{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card">
      <div class="card-header">
        <h5>📝 Create Account</h5>
      </div>
      <div class="card-body">
        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input
              type="text"
              name="username"
              class="form-control"
              minlength="3"
              required
            />
            <small class="text-muted">At least 3 characters</small>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input
              type="password"
              name="password"
              class="form-control"
              minlength="8"
              required
            />
            <small class="text-muted">At least 8 characters</small>
          </div>
          <div class="mb-3">
            <label class="form-label">Confirm Password</label>
            <input
              type="password"
              name="confirm"
              class="form-control"
              required
            />
          </div>
          <button type="submit" class="btn btn-success">Register</button>
          <a href="{{ url_for('login') }}" class="btn btn-link">
            Already have an account? Login
          </a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
